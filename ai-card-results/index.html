<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 卡片生成结果</title>
<style>
:root{
  --bg:#f6f5f1;--surface:#ffffff;--ink:#1d1f24;--muted:#646a76;--line:#e1ded6;--soft:#eef1fb;
  --accent:#2f5bd8;--accent-2:#0f7f74;--accent-3:#a8512f;--on-accent:#ffffff;
  --ok:#17703f;--bad:#b3261e;--warn:#8a5a00;--stage:#ecebe5;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14161a;--surface:#1c1f25;--ink:#e9eaee;--muted:#9aa0ac;--line:#2c3039;--soft:#222a44;
    --accent:#7f9cff;--accent-2:#4cc3b5;--accent-3:#e39a7b;--on-accent:#101114;
    --ok:#5fcf8f;--bad:#ff8f86;--warn:#e6b450;--stage:#101216;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a;--surface:#1c1f25;--ink:#e9eaee;--muted:#9aa0ac;--line:#2c3039;--soft:#222a44;
  --accent:#7f9cff;--accent-2:#4cc3b5;--accent-3:#e39a7b;--on-accent:#101114;
  --ok:#5fcf8f;--bad:#ff8f86;--warn:#e6b450;--stage:#101216;color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;letter-spacing:.2px}
h2{font-size:18px;margin:36px 0 12px}
.sub{color:var(--muted);margin:0}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,summary:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.method{margin:18px 0 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13.5px}
.method b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .k{font-size:12.5px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:650;line-height:1.25;font-variant-numeric:tabular-nums}
.tile .n{font-size:12.5px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .sp{flex:1}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:26px minmax(78px,150px) minmax(0,1fr) 62px;gap:8px;align-items:center;font-size:13.5px}
.bar .no{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;min-width:3px}
.bar .tm{text-align:right;font-variant-numeric:tabular-nums}
.k-local{background:var(--accent)}.k-datasource{background:var(--accent-2)}.k-integration{background:var(--accent-3)}
.bar.pending .tm{color:var(--muted)}
.case{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.case>summary{list-style:none;display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.case>summary::-webkit-details-marker{display:none}
.case>summary:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.case .no{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.case .ttl{font-weight:600;min-width:0}
.case .ttl small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case .tt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.bad{color:var(--bad)}.badge.wait{color:var(--warn)}
.body{padding:2px 14px 16px;border-top:1px solid var(--line)}
.req{margin:12px 0;padding:10px 12px;background:var(--soft);border-radius:8px;font-size:14px}
.req span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
dl.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px;margin:10px 0}
dl.meta div{min-width:0}
dl.meta dt{font-size:12px;color:var(--muted)}
dl.meta dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sum{white-space:pre-wrap;font-size:14px;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.sum span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.att{font-size:13px;color:var(--muted);margin:6px 0}
.att .bad{color:var(--bad)}
.pv-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.stage{background:var(--stage);border:1px dashed var(--line);border-radius:10px;padding:14px;overflow:auto;display:flex;justify-content:center}
.frame{flex:none;box-sizing:content-box;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);
  --tabbit-card-primary:var(--accent);--tabbit-card-secondary:var(--accent-2);--tabbit-card-foreground:var(--ink);
  --tabbit-card-muted:var(--muted);--tabbit-card-background:var(--surface);--tabbit-card-on-primary:var(--on-accent)}
.frame[data-size="3x3"]{width:194px;height:194px}
.frame[data-size="6x3"]{width:404px;height:194px}
.frame[data-size="3x6"]{width:194px;height:404px}
.frame[data-size="6x6"]{width:404px;height:404px}
.frame>*{display:block;width:100%;height:100%}
.pvnote{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.err{color:var(--bad);font-size:13px;padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chips a{font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px}
.chips a:hover{border-color:var(--accent)}
.gal{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:14px;scroll-margin-top:12px}
.gal-head{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.gal-head .no{color:var(--muted);font-variant-numeric:tabular-nums}
.gal-head h3{margin:0;font-size:16px}
.gal-meta{color:var(--muted);font-size:13px}
.gal-req{color:var(--muted);font-size:13.5px;margin:4px 0 12px;max-width:80ch}
.gal-row{display:flex;flex-wrap:wrap;gap:14px 16px;align-items:flex-start;overflow-x:auto;padding-bottom:2px}
.gal-col{display:flex;flex-direction:column;gap:14px}
.fig{margin:0;flex:none}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.gal-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
footer{margin-top:36px;color:var(--muted);font-size:13px}
footer li{margin:3px 0}
@media (max-width:560px){
  h1{font-size:22px}
  .bar{grid-template-columns:22px minmax(0,1fr) 54px}
  .bar .nm{grid-column:2/4;grid-row:1}
  .bar .tr{grid-column:2;grid-row:2}
  .bar .tm{grid-column:3;grid-row:2}
  .bar .no{grid-row:1/3}
  .case>summary{grid-template-columns:24px minmax(0,1fr) auto}
  .case>summary .badge{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>AI 卡片 · 24 个 case 的生成结果</h1>
      <p class="sub" id="sub"></p>
    </div>

  <div id="cases"></div>

  <footer>
    <ul id="notes"></ul>
  </footer>
</div>

\n.card[data-size=\\\"6x6\\\"] .row{padding:8px 10px}\\n\";\nconst SRC='connected.mail.message-list';\nconst DECS={archive:'建议归档',keep:'建议保留',none:'未标注'};\nconst BLANK={decision:'none',reason:'',picked:false};\nconst STEPS=[['range','范围'],['review','建议'],['confirm','归档']];\n\nfunction norm(s){\n  s=s&&typeof s==='object'?s:{};\n  const r=s.range&&typeof s.range==='object'?s.range:{};\n  return {\n    range:{from:typeof r.from==='string'?r.from:'',to:typeof r.to==='string'?r.to:''},\n    rules:typeof s.rules==='string'?s.rules:'',\n    snapshot:s.snapshot&&Array.isArray(s.snapshot.mails)?s.snapshot:null,\n    marks:s.marks&&typeof s.marks==='object'?s.marks:{}\n  };\n}\nfunction pad(n){return String(n).padStart(2,'0')}\nfunction ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}\nfunction addDays(str,n){const p=str.split('-').map(Number);return ymd(new Date(p[0],p[1]-1,p[2]+n))}\nfunction fmtTime(ms){const d=new Date(ms);return isNaN(d.getTime())?'':ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}\nfunction toYmd(v){\n  if(v==null||v==='')return '';\n  if(typeof v==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(v))return v;\n  let d;\n  if(typeof v==='number'||(typeof v==='string'&&/^\\d{9,13}$/.test(v))){const n=Number(v);d=new Date(n<1e12?n*1000:n)}\n  else if(typeof v==='string')d=new Date(v);\n  else return '';\n  return isNaN(d.getTime())?'':ymd(d);\n}\nfunction str(v){\n  if(v==null)return '';\n  if(typeof v==='string')return v;\n  if(typeof v==='number')return String(v);\n  if(Array.isArray(v))return str(v[0]);\n  if(typeof v==='object')return str(v.name||v.address||v.email||'');\n  return '';\n}\nfunction pickList(data){\n  if(Array.isArray(data))return data;\n  if(data&&typeof data==='object'){\n    const keys=['messages','items','list','mails','emails','results','data'];\n    for(let i=0;i<keys.length;i++){if(Array.isArray(data[keys[i]]))return data[keys[i]]}\n  }\n  return [];\n}\nfunction normMail(m){\n  if(!m||typeof m!=='object') <script>
const D = JSON.parse(document.getElementById('data').textContent);
const KIND = {local:'本地记录型', datasource:'平台数据源型', integration:'依赖 AI / 邮件 / 日历 / 网页'};
const SIZES = [['3x3','194×194'],['6x3','404×194'],['3x6','194×404'],['6x6','404×404']];
const $ = (s, r=document) => r.querySelector(s);

const done = D.cases.filter(c => c.status === 'ok');
const times = done.map(c => c.total_seconds).sort((a,b) => a-b);
const sum = a => a.reduce((x,y) => x+y, 0);
const median = a => a.length ? (a.length % 2 ? a[(a.length-1)/2] : (a[a.length/2-1] + a[a.length/2]) / 2) : null;

/* ---------- theme ---------- */
(function(){
  let t = null; try { t = localStorage.getItem('report-theme'); } catch(e){}
  if (t) document.documentElement.dataset.theme = t;
  $('#themeBtn').addEventListener('click', () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('report-theme', next); } catch(e){}
  });
})();

/* ---------- header / summary ---------- */
$('#sub').textContent = '生成于 ' + D.generated + ' · 技能 ' + D.skill + ' · 共 ' + D.cases.length + ' 个 case';
$('#method').innerHTML = '<b>怎么测的：</b>每个 case 都由一个独立的子代理单独完成（互不共享上下文），都按同一套流程走：读技能说明 → 写 view.js / style.css → 运行技能自带的 build.py。<b>耗时</b> = 子代理执行计时命令那一刻，到 build.py 首次构建通过为止的墙钟时间（含模型思考、写代码、构建重试）；失败的构建也计入。';
const tile = (k, v, n) => h('div', {class:'tile'}, h('div', {class:'k'}, k), h('div', {class:'v'}, v), n ? h('div', {class:'n'}, n) : null);
const fast = done.length ? done.reduce((a,b) => a.total_seconds <= b.total_seconds ? a : b) : null;
const slow = done.length ? done.reduce((a,b) => a.total_seconds >= b.total_seconds ? a : b) : null;
const attempts = done.map(c => c.attempts.length);
$('#tiles').append(
  tile('构建通过', done.length + ' / ' + D.cases.length, done.length === D.cases.length ? '全部通过技能自带的 5 项检查' : (D.cases.length - done.length) + ' 个未通过或未完成'),
  tile('平均耗时', done.length ? fmtCN(sum(times)/done.length) : '—', '中位数 ' + (done.length ? fmtCN(median(times)) : '—')),
  tile('最快', fast ? fmtCN(fast.total_seconds) : '—', fast ? fast.title : ''),
  tile('最慢', slow ? fmtCN(slow.total_seconds) : '—', slow ? slow.title : ''),
  tile('单个耗时之和', done.length ? fmtCN(sum(times)) : '—', '并行跑，实际墙钟更短'),
  tile('平均构建次数', done.length ? (sum(attempts)/done.length).toFixed(1) : '—', done.length ? '一次通过 ' + attempts.filter(x => x === 1).length + ' 个' : '')
);

/* ---------- bars ---------- */
const maxT = Math.max(1, ...times);
$('#legend').append(...Object.entries(KIND).map(([k,v]) => h('span', {}, h('i', {class:'k-' + k}), v)));
const sortBtn = h('button', {class:'btn', type:'button'}, '按耗时排序');
$('#legend').append(h('span', {class:'sp'}), sortBtn);
let byTime = false;
function drawBars(){
  const list = D.cases.slice().sort(byTime ? (a,b) => (b.total_seconds ?? -1) - (a.total_seconds ?? -1) : (a,b) => a.no - b.no);
  const box = $('#bars'); box.replaceChildren();
  for (const c of list){
    const ok = c.status === 'ok';
    box.append(h('div', {class:'bar' + (ok ? '' : ' pending'), title: c.title + '：' + (ok ? c.total_seconds.toFixed(1) + ' 秒' : '未完成')},
      h('span', {class:'no'}, c.no),
      h('span', {class:'nm'}, c.title),
      h('div', {class:'tr'}, ok ? h('div', {class:'fill k-' + c.kind, style:'width:' + (c.total_seconds / maxT * 100).toFixed(2) + '%'}) : null),
      h('span', {class:'tm'}, ok ? fmtMS(c.total_seconds) : '—')));
  }
}
sortBtn.addEventListener('click', () => { byTime = !byTime; sortBtn.textContent = byTime ? '按编号排序' : '按耗时排序'; drawBars(); });
drawBars();

/* ---------- preview host ---------- */
const COLORS = {primary:'var(--accent)', secondary:'var(--accent-2)', foreground:'var(--ink)', muted:'var(--muted)', background:'var(--surface)', onPrimary:'var(--on-accent)'};

  const mem = {};

    ctx: {surface:'card', size, colors: COLORS},
    storage: {

  const p = import(url).then(m => {
    const tag = 'ai-card-' + c.id;
    if (!customElements.get(tag)) customElements.define(tag, m.default);

  }).finally(() => URL.revokeObjectURL(url));

  const tag = await loadCard(c);

  el.tabbitHost = makeHost(c, size, () => el);
  if (!live.has(c.id)) live.set(c.id, new Set());
  live.get(c.id).add(el);

}

  try { Object.keys(localStorage).filter(k => k.startsWith('aicard-preview:' + c.id + ':')).forEach(k => localStorage.removeItem(k)); } catch(e){}
}

/* ---------- case list ---------- */

}

  const msg = h('p', {class:'pvnote'}, '预览用的是浏览器内的模拟宿主：数据只存在你这台设备的浏览器里；天气、邮件、日历、AI、网页请求都没有接入，相关卡片会显示它自己的“未接入 / 获取失败”状态。');

      h('span', {class:'tt'}, c.status === 'ok' ? fmtCN(c.total_seconds) : '—')),
    h('div', {class:'body'},
      h('div', {class:'req'}, h('span', {}, '需求原文'), c.request),
      h('dl', {class:'meta'},
        h('div', {}, h('dt', {}, '耗时（开始计时 → 构建通过）'), h('dd', {}, c.status === 'ok' ? fmtCN(c.total_seconds) + '（' + c.total_seconds.toFixed(1) + ' 秒）' : '—')),
        h('div', {}, h('dt', {}, '构建次数'), h('dd', {}, att.length ? att.length + ' 次（' + att.filter(a => a.ok).length + ' 次通过）' : '—')),
        h('div', {}, h('dt', {}, '构建命令本身耗时'), h('dd', {}, att.length ? att.map(a => a.build_seconds.toFixed(1) + 's').join(' / ') : '—')),
        h('div', {}, h('dt', {}, '子代理总用时（含启动与收尾）'), h('dd', {}, c.agent?.duration_ms ? fmtCN(c.agent.duration_ms/1000) : '—')),
        h('div', {}, h('dt', {}, '工具调用 / tokens'), h('dd', {}, c.agent ? ((c.agent.tool_uses ?? '—') + ' 次 / ' + (c.agent.total_tokens != null ? c.agent.total_tokens.toLocaleString('zh-CN') : '—')) : '—')),
        h('div', {}, h('dt', {}, '卡片包大小'), h('dd', {}, c.bytes ? (c.bytes/1024).toFixed(1) + ' KB' : '—')),
        h('div', {}, h('dt', {}, 'sha256'), h('dd', {}, c.sha256 ? c.sha256.slice(0, 16) + '…' : '—'))),
      att.some(a => !a.ok) ? h('div', {class:'att'}, h('b', {class:'bad'}, '失败的构建：'), att.filter(a => !a.ok).map((a, i) => h('div', {}, '第 ' + (att.indexOf(a)+1) + ' 次：' + (a.error || '').trim().split('\n').slice(-2).join(' ').slice(0, 260)))) : null,
      c.agent?.summary ? h('div', {class:'sum'}, h('span', {}, '子代理交付说明'), c.agent.summary) : null,
      c.pkg ? h('div', {class:'pv-head'},
        h('strong', {}, '实际操作'),
        h('div', {class:'seg', role:'group', 'aria-label':'卡片尺寸'}, segBtns),
        h('button', {class:'btn', type:'button', onclick: () => { resetData(c); mountIt(); }}, '清空预览数据'),

  details.addEventListener('toggle', () => {
    if (details.open && !opened) { opened = true; mountIt(); }
    if (!details.open && opened) { opened = false; if (el) dropCard(c, el); el = null; stage.replaceChildren(); }
  });
  return details;
}
$('#cases').append(...D.cases.map(buildCase));
if (location.hash) { const t = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (t && t.tagName === 'DETAILS') t.open = true; }

/* ---------- gallery: every card at every size ---------- */
const SIZE_LABEL = {'3x3':'3x3 · 194×194', '6x3':'6x3 · 404×194', '3x6':'3x6 · 194×404', '6x6':'6x6 · 404×404'};
const galFrames = [];
function buildGallery(c){
  const figs = {};
  for (const s of Object.keys(SIZE_LABEL)) figs[s] = h('figure', {class:'fig'}, h('div', {class:'frame', 'data-size': s}), h('figcaption', {}, SIZE_LABEL[s]));
  const att = (c.attempts || []).length;
  const sec = h('section', {class:'gal', id:'g-' + c.id},
    h('div', {class:'gal-head'}, h('span', {class:'no'}, c.no), h('h3', {}, c.title),
      h('span', {class:'gal-meta'}, KIND[c.kind] + (c.status === 'ok' ? ' · ' + fmtCN(c.total_seconds) + ' · 构建 ' + att + ' 次' : ' · 未完成'))),
    h('p', {class:'gal-req'}, c.request),
    h('div', {class:'gal-row'}, figs['6x6'], figs['3x6'], h('div', {class:'gal-col'}, figs['6x3'], figs['3x3'])));
  let started = false;
  sec._start = async () => {
    if (started || !c.pkg) return; started = true;
    for (const s of ['3x3', '6x3', '3x6', '6x6']) { // 依次挂载，避免四个实例同时初始化同一份数据
      const frame = $('.frame', figs[s]);
      try { await spawnCard(c, s, frame); galFrames.push(frame); }
      catch(e){ frame.append(h('div', {class:'err', role:'alert'}, '预览加载失败：' + (e && e.message || e))); }
      await new Promise(r => setTimeout(r, 40));
      $('#galCount').textContent = '已加载 ' + galFrames.length + ' / ' + D.cases.filter(x => x.pkg).length * 4 + ' 个预览';
    }
  };
  return sec;
}
const gallerySecs = D.cases.map(buildGallery);
$('#gallery').append(...gallerySecs);
$('#jump').append(...D.cases.map(c => h('a', {href:'#g-' + c.id}, c.no + ' ' + c.title)));
$('#galCount').textContent = '滚动到哪里就加载到哪里';
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target._start(); io.unobserve(e.target); } }), {rootMargin:'500px 0px'});
  gallerySecs.forEach(sct => io.observe(sct));
} else gallerySecs.forEach(sct => sct._start());
$('#resetAll').addEventListener('click', () => {
  D.cases.forEach(resetData);
  live.forEach(set => set.forEach(el => { if (el.isConnected && el.load) el.load(); }));
});

/* ---------- notes ---------- */
$('#notes').append(...D.notes.map(t => h('li', {}, t)));
</script>
</body>
